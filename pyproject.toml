[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[project]
name = "p2a_impacts"
version = "0.4.0"
description = "Climate impacts engine for Plan2Adapt.ca"
authors = [{ name = "Nikola Rados", email = "nrados@uvic.ca" }]
license = { text = "GNU General Public License v3 (GPLv3)" }
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]

requires-python = ">=3.10, <4"
dependencies = [
  "ce @ git+https://github.com/pacificclimate/climate-explorer-backend.git@py-sprint-25q1",
  "GDAL>=3.3.0,<3.4",
  "cf_cell_methods>=0.1.0,<1.0.0",
  "contexttimer>=0.3.3,<1.0.0",
  "setuptools>=79.0.1,<80.0.0",
  "shapely>=2.1.1,<3.0.0",
  "sly>=0.5,<1.0.0",

]


[project.optional-dependencies]
test = [
  "black>=25.1.0,<26.0.0",
  "mock>=5.2.0,<6.0.0",
  "pre_commit>=4.2.0,<5.0.0",
  "pytest>=8.3.5,<9.0.0",
  "pytest_cov>=6.1.1,<7.0.0",
  "requests_mock>=1.12.1,<2.0.0",
]


[project.urls]
homepage = "http://www.pacificclimate.org/"
repository = "https://github.com/pacificclimate/wps-tools"

[[tool.poetry.source]]
name = "pcic"
url = "https://pypi.pacificclimate.org/simple"
priority = "supplemental"

[tool.pytest.ini_options]
markers = [
  "online: marks tests that use online resources (deselect with '-m \"not online\"')",
  "slow: marks tests that are slow (deselect with '-m \"not slow\"')",
]
